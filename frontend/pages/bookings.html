<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - ShiftMate</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <span>🚚</span> ShiftMate
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="upload.html">New Booking</a></li>
                <li><a href="bookings.html">My Bookings</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="margin-bottom: 2rem;">
            <h1>📦 My Bookings</h1>
            <p>View and manage your moving bookings</p>
        </div>

        <!-- Alert -->
        <div id="alert" class="alert"></div>

        <!-- Filter and Search -->
        <div class="card">
            <div class="flex-between">
                <div style="flex: 1; margin-right: 1rem;">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search by address or customer..." 
                        class="form-input"
                        style="margin-bottom: 0;"
                    >
                </div>
                <select id="statusFilter" class="form-select" style="width: 200px; margin-bottom: 0;">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
        </div>

        <!-- Bookings Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalBookings">0</div>
                <div class="stat-label">Total Bookings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="pendingBookings">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="confirmedBookings">0</div>
                <div class="stat-label">Confirmed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedBookings">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Bookings List -->
        <div class="card">
            <h2 class="card-title">All Bookings</h2>
            
            <div id="loading" class="loading show">
                <div class="spinner"></div>
                <p>Loading bookings...</p>
            </div>

            <div id="bookingsContainer"></div>
        </div>

        <!-- Booking Detail Modal -->
        <div id="bookingModal" class="modal hidden" style="display: none;">
            <div class="modal-overlay" onclick="closeBookingModal()"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Booking Details</h2>
                    <button onclick="closeBookingModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
                </div>
                <div id="bookingDetails"></div>
            </div>
        </div>
    </div>

    <!-- Modal Styles -->
    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
        }
        .modal.hidden {
            display: none !important;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            position: relative;
            background: white;
            max-width: 800px;
            margin: 2rem auto;
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .modal-body {
            padding: 1.5rem;
        }
    </style>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script>
        let allBookings = [];
        let filteredBookings = [];

        async function loadBookings() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('bookingsContainer');

            try {
                allBookings = await api.getBookings();
                filteredBookings = [...allBookings];
                
                updateStats();
                displayBookings(filteredBookings);
                
                loading.classList.remove('show');
            } catch (error) {
                loading.classList.remove('show');
                container.innerHTML = `
                    <div class="alert alert-error show">
                        Failed to load bookings: ${error.message}
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('totalBookings').textContent = allBookings.length;
            document.getElementById('pendingBookings').textContent = 
                allBookings.filter(b => b.status === 'pending').length;
            document.getElementById('confirmedBookings').textContent = 
                allBookings.filter(b => b.status === 'confirmed').length;
            document.getElementById('completedBookings').textContent = 
                allBookings.filter(b => b.status === 'completed').length;
        }

        function displayBookings(bookings) {
            const container = document.getElementById('bookingsContainer');

            if (bookings.length === 0) {
                container.innerHTML = `
                    <p style="text-align: center; color: #999; padding: 2rem;">
                        No bookings found. <a href="upload.html" style="color: var(--primary);">Create your first booking</a>
                    </p>
                `;
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Booking ID</th>
                                <th>Customer</th>
                                <th>Pickup → Dropoff</th>
                                <th>Distance</th>
                                <th>Items</th>
                                <th>Scheduled Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${bookings.map(booking => `
                                <tr>
                                    <td><strong>${booking.id.substring(0, 8)}...</strong></td>
                                    <td>
                                        <div>${booking.user.name}</div>
                                        <div style="font-size: 0.85rem; color: #666;">${booking.user.email}</div>
                                    </td>
                                    <td>
                                        <div style="font-size: 0.9rem;">
                                            <div>${booking.pickupAddress.substring(0, 30)}...</div>
                                            <div style="color: #666;">→ ${booking.dropoffAddress.substring(0, 30)}...</div>
                                        </div>
                                    </td>
                                    <td>${booking.distance.toFixed(1)} km</td>
                                    <td>
                                        <span class="badge badge-info">${booking.items.length} items</span>
                                    </td>
                                    <td>${new Date(booking.scheduledDate).toLocaleDateString()}</td>
                                    <td>
                                        <span class="badge badge-${getStatusBadgeClass(booking.status)}">
                                            ${booking.status}
                                        </span>
                                    </td>
                                    <td>
                                        <button onclick="viewBooking('${booking.id}')" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.9rem;">
                                            View
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getStatusBadgeClass(status) {
            const statusMap = {
                'pending': 'warning',
                'confirmed': 'success',
                'in_progress': 'info',
                'completed': 'success',
                'cancelled': 'danger'
            };
            return statusMap[status] || 'info';
        }

        function viewBooking(bookingId) {
            const booking = allBookings.find(b => b.id === bookingId);
            if (!booking) return;

            const modal = document.getElementById('bookingModal');
            const details = document.getElementById('bookingDetails');

            const totalVolume = booking.items.reduce((sum, item) => sum + (item.volume * item.quantity), 0);

            details.innerHTML = `
                <div class="modal-body">
                    <div class="grid grid-2" style="margin-bottom: 1.5rem;">
                        <div>
                            <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Customer Information</h3>
                            <p><strong>Name:</strong> ${booking.user.name}</p>
                            <p><strong>Email:</strong> ${booking.user.email}</p>
                            <p><strong>Phone:</strong> ${booking.user.phone || 'N/A'}</p>
                        </div>
                        <div>
                            <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Booking Information</h3>
                            <p><strong>Booking ID:</strong> ${booking.id}</p>
                            <p><strong>Status:</strong> <span class="badge badge-${getStatusBadgeClass(booking.status)}">${booking.status}</span></p>
                            <p><strong>Created:</strong> ${utils.formatDate(booking.createdAt)}</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Addresses</h3>
                        <p><strong>📍 Pickup:</strong> ${booking.pickupAddress}</p>
                        <p><strong>📍 Dropoff:</strong> ${booking.dropoffAddress}</p>
                        <p><strong>📏 Distance:</strong> ${booking.distance.toFixed(1)} km</p>
                    </div>

                    <div style="margin-bottom: 1.5rem;">
                        <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Schedule</h3>
                        <p><strong>Scheduled Date:</strong> ${utils.formatDate(booking.scheduledDate)}</p>
                    </div>

                    <div>
                        <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Items (${booking.items.length})</h3>
                        <div style="background: var(--light); padding: 1rem; border-radius: 10px;">
                            <div class="stats-grid" style="margin-bottom: 1rem;">
                                <div style="background: white; padding: 1rem; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">
                                        ${totalVolume.toFixed(2)} m³
                                    </div>
                                    <div style="color: #666; font-size: 0.9rem;">Total Volume</div>
                                </div>
                                <div style="background: white; padding: 1rem; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary);">
                                        ${booking.items.reduce((sum, item) => sum + item.quantity, 0)}
                                    </div>
                                    <div style="color: #666; font-size: 0.9rem;">Total Items</div>
                                </div>
                            </div>
                            ${booking.items.map(item => `
                                <div style="background: white; padding: 1rem; margin-bottom: 0.5rem; border-radius: 8px; border-left: 3px solid var(--primary);">
                                    <div class="flex-between">
                                        <div>
                                            <strong>${item.name}</strong>
                                            <div style="color: #666; font-size: 0.9rem;">
                                                ${item.category} • ${item.volume.toFixed(3)} m³ each • Qty: ${item.quantity}
                                            </div>
                                        </div>
                                        ${item.confidence ? `
                                            <div class="badge badge-info">
                                                ${(item.confidence * 100).toFixed(0)}% confidence
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            modal.style.display = 'block';
        }

        function closeBookingModal() {
            const modal = document.getElementById('bookingModal');
            modal.classList.add('hidden');
            modal.style.display = 'none';
        }

        // Search and filter
        document.getElementById('searchInput').addEventListener('input', utils.debounce((e) => {
            filterBookings();
        }, 300));

        document.getElementById('statusFilter').addEventListener('change', () => {
            filterBookings();
        });

        function filterBookings() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            filteredBookings = allBookings.filter(booking => {
                const matchesSearch = 
                    booking.user.name.toLowerCase().includes(searchTerm) ||
                    booking.user.email.toLowerCase().includes(searchTerm) ||
                    booking.pickupAddress.toLowerCase().includes(searchTerm) ||
                    booking.dropoffAddress.toLowerCase().includes(searchTerm) ||
                    booking.id.toLowerCase().includes(searchTerm);

                const matchesStatus = !statusFilter || booking.status === statusFilter;

                return matchesSearch && matchesStatus;
            });

            displayBookings(filteredBookings);
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', loadBookings);
    </script>
</body>
</html>
